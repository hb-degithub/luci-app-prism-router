name: release

# 用法：
#   1) 打标签推送：git tag v1.0.1 && git push origin v1.0.1
#   2) 或在 Actions 页手动 Run（输入 tag）
# 产物：luci-app-prism-router_*.ipk + prism-router-android-<version>.apk
#
# 正式签名：仓库 Secret 配好下面三项后，CI 产出 release 签名 APK；
# 未配置时自动退回 debug 签名（保证能构建，但安装前需卸载同包名旧版）。
#   PRISM_KEYSTORE_BASE64   keystore 的 base64（单行）
#   PRISM_STORE_PASSWORD    keystore 口令
#   PRISM_KEY_PASSWORD      密钥口令（通常与 keystore 相同）
# 别名固定 prism-router，可用 PRISM_KEY_ALIAS 覆盖。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（例如 v1.0.1）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then VERSION="${{ github.ref_name }}"; fi
          VERSION="${VERSION#[vV]}"
          case "$VERSION" in
            ''|*[!0-9A-Za-z.+_-]*) echo "非法版本号：[$VERSION]" >&2; exit 1 ;;
          esac
          # 单调 versionCode：major*10000 + minor*100 + patch（1.0.3=10003，1.0.4=10004，1.0.5=10005，1.0.6=10006）。
          BASE="${VERSION%%-*}"
          CODE=$(printf '%s' "$BASE" | awk -F. '
            NF < 3 { print 0; exit }
            { printf "%d", ($1 * 10000 + $2 * 100 + $3) }')
          [ "$CODE" -gt 0 ] || { echo "无法从 $VERSION 生成 versionCode" >&2; exit 1; }
          {
            echo "VERSION=$VERSION"
            echo "PRISM_VERSION_NAME=$VERSION"
            echo "PRISM_VERSION_CODE=$CODE"
          } >> "$GITHUB_ENV"

      - name: Build ipk
        run: |
          # SDK 元数据与手搓包使用同一个 tag 版本；build-ipk.sh 还会把版本注入
          # 包内 daemon/rpcd/metrics/feishu 常量，产物文件名与 control 均由 VERSION 派生。
          if [ -n "$VERSION" ]; then
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$VERSION/" luci-app-prism-router/Makefile
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" luci-app-prism-router/Makefile
          fi
          chmod +x tools/build-ipk.sh
          PRISM_VER="$VERSION" PRISM_REL=1 bash tools/build-ipk.sh
          ls -lh dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.PRISM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRISM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PRISM_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/prism-router.jks
          {
            echo "PRISM_STORE_PASSWORD=$STORE_PASSWORD"
            echo "PRISM_KEY_PASSWORD=$KEY_PASSWORD"
            echo "PRISM_KEY_ALIAS=${PRISM_KEY_ALIAS:-prism-router}"
          } >> android/gradle.properties
          ls -l android/keystore/prism-router.jks

      - name: Android unit tests
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew testDebugUnitTest --no-daemon --console=plain \
            -PPRISM_VERSION_NAME="$PRISM_VERSION_NAME" \
            -PPRISM_VERSION_CODE="$PRISM_VERSION_CODE"

      - name: Build Android APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p ../out
          GRADLE_VERSION_ARGS=(
            -PPRISM_VERSION_NAME="$PRISM_VERSION_NAME"
            -PPRISM_VERSION_CODE="$PRISM_VERSION_CODE"
          )
          if [ -f keystore/prism-router.jks ]; then
            echo "使用 release 签名构建"
            ./gradlew assembleRelease --no-daemon --console=plain "${GRADLE_VERSION_ARGS[@]}"
            SRC=app/build/outputs/apk/release/app-release.apk
          else
            echo "未配置 keystore，退回 debug 签名"
            ./gradlew assembleDebug --no-daemon --console=plain "${GRADLE_VERSION_ARGS[@]}"
            SRC=app/build/outputs/apk/debug/app-debug.apk
          fi
          # 文件名取 Gradle 实际生效的 versionName，而不是另写一份变量。
          ACTUAL_NAME=$(./gradlew -q :app:printVersionName "${GRADLE_VERSION_ARGS[@]}" | tail -n 1)
          [ "$ACTUAL_NAME" = "$PRISM_VERSION_NAME" ] || {
            echo "versionName 不一致：期望 $PRISM_VERSION_NAME，实际 $ACTUAL_NAME" >&2; exit 1; }
          cp "$SRC" "../out/prism-router-android-${ACTUAL_NAME}.apk"
          # 再用 aapt 读 APK 内 versionName/versionCode，防止资产名与包内版本漂移。
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if [ -x "$AAPT" ]; then
            BADGING=$("$AAPT" dump badging "$SRC" | head -n 1)
            GOT=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)' versionName='\([^']*\)'.*/\1 \2/p")
            [ "$GOT" = "$PRISM_VERSION_CODE $ACTUAL_NAME" ] || {
              echo "APK 内版本不一致：期望 $PRISM_VERSION_CODE $ACTUAL_NAME，实际 [$GOT]" >&2
              printf '%s\n' "$BADGING" >&2
              exit 1
            }
          else
            echo "WARNING: 未找到 $AAPT，跳过 APK badging 校验" >&2
          fi

      - name: Collect artifacts
        run: |
          cp dist/*.ipk out/
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 棱镜路由 ${{ inputs.tag || github.ref_name }}
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
