name: release

# Android App 独立发版（与路由器插件解耦）。
#
# 触发：tag `app-v<versionName>`（如 app-v1.0.10）或 Actions 手动 Run。
# 说明：
# - App 版本唯一来源是 android/version.properties；tag 必须与它一致，versionCode
#   必须满足 major*10000+minor*100+patch（minor/patch < 100）；
# - 只构建 Android APK；release 里必须至少有一个 `.apk` 资产，否则任务失败；
# - 用 `aapt dump badging` 校验 APK 内 versionName / versionCode 与 tag 一致；
# - APK 资产名固定为 prism-router-<versionName>.apk；下载交给系统浏览器 / 下载器。
# - 插件发版走 release-plugin.yml（v<plugin-version>），不会出现在本流程里。
#
# 正式签名：仓库 Secret 配好下面三项后，CI 产出 release 签名 APK；
# 未配置时自动退回 debug 签名（保证能构建，但安装前需卸载同包名旧版）。
#   PRISM_KEYSTORE_BASE64   keystore 的 base64（单行）
#   PRISM_STORE_PASSWORD    keystore 口令
#   PRISM_KEY_PASSWORD      密钥口令（通常与 keystore 相同）
# 别名固定 prism-router，可用 PRISM_KEY_ALIAS 覆盖。

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'App Release tag（例如 app-v1.0.10）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve App version
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          case "$TAG" in
            app-v*) ;;
            *) echo "非法 App tag：[$TAG]（应为 app-v<app-version>）" >&2; exit 1 ;;
          esac
          APP_TAG_VERSION="${TAG#app-v}"

          # App 版本唯一来源：android/version.properties。
          APP_FILE_VERSION=$(awk -F= '$1=="versionName" {v=$2; gsub(/[ \t\r]/, "", v); print v; exit}' android/version.properties)
          APP_FILE_CODE=$(awk -F= '$1=="versionCode" {v=$2; gsub(/[ \t\r]/, "", v); print v; exit}' android/version.properties)
          [ -n "$APP_FILE_VERSION" ] || { echo "android/version.properties 缺少 versionName" >&2; exit 1; }
          [ -n "$APP_FILE_CODE" ] || { echo "android/version.properties 缺少 versionCode" >&2; exit 1; }

          if [[ ! "$APP_FILE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "App versionName 必须为 major.minor.patch：[$APP_FILE_VERSION]" >&2
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          if [ "$MINOR" -ge 100 ] || [ "$PATCH" -ge 100 ]; then
            echo "App versionName [$APP_FILE_VERSION] 的 minor/patch 必须 < 100" >&2
            exit 1
          fi
          EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [ "$APP_FILE_CODE" != "$EXPECTED_CODE" ]; then
            echo "android/version.properties 版本不自洽：versionName=$APP_FILE_VERSION 应对应 versionCode=$EXPECTED_CODE，实际=$APP_FILE_CODE" >&2
            exit 1
          fi
          if [ "$APP_TAG_VERSION" != "$APP_FILE_VERSION" ]; then
            echo "App tag 与 android/version.properties 不一致：tag=$APP_TAG_VERSION，文件=$APP_FILE_VERSION" >&2
            exit 1
          fi

          {
            echo "TAG=$TAG"
            echo "APP_VERSION=$APP_FILE_VERSION"
            echo "APP_VERSION_CODE=$EXPECTED_CODE"
            echo "PRISM_VERSION_NAME=$APP_FILE_VERSION"
            echo "PRISM_VERSION_CODE=$EXPECTED_CODE"
          } >> "$GITHUB_ENV"
          echo "app=$APP_FILE_VERSION ($EXPECTED_CODE) tag=$TAG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.PRISM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRISM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PRISM_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "未配置 PRISM_KEYSTORE_BASE64，跳过 release 签名（将退回 debug 签名）"
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/prism-router.jks
          {
            echo "PRISM_STORE_PASSWORD=$STORE_PASSWORD"
            echo "PRISM_KEY_PASSWORD=$KEY_PASSWORD"
            echo "PRISM_KEY_ALIAS=${PRISM_KEY_ALIAS:-prism-router}"
          } >> android/gradle.properties
          ls -l android/keystore/prism-router.jks

      - name: Android unit tests
        run: |
          set -euo pipefail
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew testDebugUnitTest --no-daemon --console=plain \
            -PPRISM_VERSION_NAME="$PRISM_VERSION_NAME" \
            -PPRISM_VERSION_CODE="$PRISM_VERSION_CODE"

      - name: Build Android APK
        run: |
          set -euo pipefail
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p ../out
          GRADLE_VERSION_ARGS=(
            -PPRISM_VERSION_NAME="$PRISM_VERSION_NAME"
            -PPRISM_VERSION_CODE="$PRISM_VERSION_CODE"
          )
          if [ -f keystore/prism-router.jks ]; then
            echo "使用 release 签名构建"
            ./gradlew assembleRelease --no-daemon --console=plain "${GRADLE_VERSION_ARGS[@]}"
            SRC=app/build/outputs/apk/release/app-release.apk
          else
            echo "未配置 keystore，退回 debug 签名"
            ./gradlew assembleDebug --no-daemon --console=plain "${GRADLE_VERSION_ARGS[@]}"
            SRC=app/build/outputs/apk/debug/app-debug.apk
          fi

          # 校验 Gradle 实际生效版本与 version.properties 一致。
          ACTUAL_NAME=$(./gradlew -q :app:printVersionName "${GRADLE_VERSION_ARGS[@]}" | tail -n 1)
          ACTUAL_CODE=$(./gradlew -q :app:printVersionCode "${GRADLE_VERSION_ARGS[@]}" | tail -n 1)
          [ "$ACTUAL_NAME" = "$APP_VERSION" ] || {
            echo "versionName 不一致：期望 $APP_VERSION，实际 $ACTUAL_NAME" >&2; exit 1; }
          [ "$ACTUAL_CODE" = "$APP_VERSION_CODE" ] || {
            echo "versionCode 不一致：期望 $APP_VERSION_CODE，实际 $ACTUAL_CODE" >&2; exit 1; }

          cp "$SRC" "../out/prism-router-${APP_VERSION}.apk"

          # 用 aapt 读 APK 内 versionName/versionCode，防止资产名与包内版本漂移。
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if [ ! -x "$AAPT" ]; then
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          fi
          [ -n "$AAPT" ] && [ -x "$AAPT" ] || {
            echo "未找到 aapt，无法校验 APK 内版本" >&2; exit 1; }
          BADGING=$("$AAPT" dump badging "$SRC" | head -n 1)
          GOT_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          GOT_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          [ "$GOT_NAME" = "$APP_VERSION" ] || {
            echo "APK 内 versionName 与 tag 不一致：期望 $APP_VERSION，实际 [$GOT_NAME]" >&2
            printf '%s\n' "$BADGING" >&2
            exit 1
          }
          [ "$GOT_CODE" = "$APP_VERSION_CODE" ] || {
            echo "APK 内 versionCode 不一致：期望 $APP_VERSION_CODE，实际 [$GOT_CODE]" >&2
            printf '%s\n' "$BADGING" >&2
            exit 1
          }

          shopt -s nullglob
          APKS=(../out/*.apk)
          [ "${#APKS[@]}" -ge 1 ] || {
            echo "App release 没有生成任何 APK 资产" >&2; exit 1; }

      - name: Collect artifacts
        run: |
          set -euo pipefail
          [ -n "$(ls -A out)" ] || { echo "没有可发布的 APK" >&2; exit 1; }
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 棱镜路由 Android v${{ env.APP_VERSION }}
          body: |
            Android 客户端独立发版。App 更新只依赖 GitHub Releases，与路由器插件版本解耦。
          files: out/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false

      - name: Verify release has APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "release $TAG assets:"
          printf '%s\n' "$ASSETS"
          APK_COUNT=$(printf '%s\n' "$ASSETS" | grep -c '\.apk$' || true)
          [ "$APK_COUNT" -ge 1 ] || {
            echo "App release $TAG 没有 APK 资产；不能静默发布" >&2
            exit 1
          }
