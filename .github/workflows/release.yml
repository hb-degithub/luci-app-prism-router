name: release

# 用法：
#   1) 打标签推送：git tag v1.0.1 && git push origin v1.0.1
#   2) 或在 Actions 页手动 Run（输入 tag）
# 产物：luci-app-prism-router_*.ipk + prism-router-android-<version>.apk
#
# 正式签名：仓库 Secret 配好下面三项后，CI 产出 release 签名 APK；
# 未配置时自动退回 debug 签名（保证能构建，但安装前需卸载同包名旧版）。
#   PRISM_KEYSTORE_BASE64   keystore 的 base64（单行）
#   PRISM_STORE_PASSWORD    keystore 口令
#   PRISM_KEY_PASSWORD      密钥口令（通常与 keystore 相同）
# 别名固定 prism-router，可用 PRISM_KEY_ALIAS 覆盖。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（例如 v1.0.1）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then VERSION="${{ github.ref_name }}"; fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build ipk
        run: |
          chmod +x tools/build-ipk.sh
          bash tools/build-ipk.sh
          ls -lh dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.PRISM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRISM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PRISM_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/prism-router.jks
          {
            echo "PRISM_STORE_PASSWORD=$STORE_PASSWORD"
            echo "PRISM_KEY_PASSWORD=$KEY_PASSWORD"
            echo "PRISM_KEY_ALIAS=${PRISM_KEY_ALIAS:-prism-router}"
          } >> android/gradle.properties
          ls -l android/keystore/prism-router.jks

      - name: Build Android APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p ../out
          if [ -f keystore/prism-router.jks ]; then
            echo "使用 release 签名构建"
            ./gradlew assembleRelease --no-daemon --console=plain
            cp app/build/outputs/apk/release/app-release.apk "../out/prism-router-android-${VERSION}.apk"
          else
            echo "未配置 keystore，退回 debug 签名"
            ./gradlew assembleDebug --no-daemon --console=plain
            cp app/build/outputs/apk/debug/app-debug.apk "../out/prism-router-android-${VERSION}.apk"
          fi

      - name: Collect artifacts
        run: |
          cp dist/*.ipk out/
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 棱镜路由 ${{ inputs.tag || github.ref_name }}
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
