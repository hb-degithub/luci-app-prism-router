# 棱镜路由 Android 客户端版本单一来源。
#
# 只改这个文件来发 App 版本；`android/app/build.gradle.kts` 会读取它并校验：
#   versionCode == major*10000 + minor*100 + patch，且 minor / patch < 100。
# 例：1.0.9 -> 10009；1.2.3 -> 10203。
#
# 发布 App 时使用独立的 app-v<versionName> tag（例如 app-v1.0.10），
# CI 会校验 tag 与本文件一致；插件发版仍用 v<plugin-version> tag，两者互不覆盖。
versionName=1.0.9
versionCode=10009
